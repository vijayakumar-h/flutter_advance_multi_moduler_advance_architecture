name: flutter_advance_multi_moduler_advance_architecture
environment:
  sdk: ^3.12.1

workspace:
  - core/**
  - features/**

# 1. Add the dependencies the main app needs:
dependencies:
  app_settings:
    path: features/settings/app_settings
  datastore:
    path: core/datastore
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  injectable: ^3.0.0

# 2. Add build_runner and generators to dev_dependencies:
dev_dependencies:
  melos: ^8.3.0
  build_runner: ^2.15.1
  injectable_generator: ^3.1.3
  flutter_test:
    sdk: flutter

melos:
  command:
    bootstrap:
      # These will sync package versions across the workspace:
      dependencies:
        get_it: ^9.2.1
        dio: ^5.11.0
        injectable: ^3.0.0
        json_annotation: ^4.12.0

      dev_dependencies:
        injectable_generator: ^3.1.3
        json_serializable: ^6.14.1
        build_runner: ^2.15.1
        flutter_lints: ^6.0.0

  scripts:
    clean: melos clean
    cleanAndBootstrap: melos clean && melos bootstrap
    test:
      run: melos exec --concurrency=1 -- flutter test
    update: flutter pub outdated
    upgrade: flutter pub upgrade --major-versions
    # A single command to watch code generation across the entire workspace:
    watch-all:
      run: melos exec --concurrency=1 -- flutter pub run build_runner watch --delete-conflicting-outputs
